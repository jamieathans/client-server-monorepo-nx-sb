env:
  JAVA_VERSION: 25
  NODE_VERSION: 24.x
  AZURE_WEBAPP_NAME: client-server-monorepo-linux

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          #cache: maven
          #cache-dependency-path: "${{ github.workspace }}/server/**/pom.xml"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          #cache: npm
          #cache-dependency-path: "${{ github.workspace }}/client/package-lock.json"

      - name: Execute custom build script
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh ci

      - name: Upload jar artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: "${{ github.workspace }}/server/app/target/*.jar"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # AZURE_WEBAPP_PUBLISH_PROFILE secret needs to be defined in the repo.
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "*.jar"
